<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSV</title><style>body{max-width:680px;margin:60px auto;padding:20px;font:16px/1.6 system-ui;background:#101725;color:#dfe7fa}button{padding:12px;cursor:pointer}input{display:none}</style><h1 data-i18n="snapshotTitle"></h1><p data-i18n="snapshotHint"></p><button data-i18n="snapshotChoose"></button><input type="file" accept=".csv"><p role="status"></p><script src="../js/i18n.js"></script><script>
(async()=>{const lang=(navigator.language||'en').split('-')[0];await GardenI18n.load('../locales/translations.csv');GardenI18n.localize(document,lang);document.querySelector('button').onclick=()=>document.querySelector('input').click();document.querySelector('input').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>2000000)throw Error('size');const csv=await file.text(),rows=GardenI18n.parseCSV(csv),ids=new Set();if(rows[0].join(',')!=='text_id,es,zh,en,ja')throw Error('header');for(const row of rows.slice(1)){if(row.length!==5||row.some(v=>!v)||ids.has(row[0]))throw Error('row');ids.add(row[0]);const placeholders=s=>[...s.matchAll(/\{(\w+)\}/g)].map(m=>m[1]).sort().join(',');if(row.slice(1).some(v=>placeholders(v)!==placeholders(row[1])))throw Error('placeholders')}const bytes=new TextEncoder().encode(csv);let binary='';for(const b of bytes)binary+=String.fromCharCode(b);const blob=new Blob(['// Generated from translations.csv.\nwindow.GARDEN_LOCAL_CSV="'+btoa(binary)+'";\n'],{type:'text/javascript'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='translations.generated.js';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),30000);document.querySelector('[role=status]').textContent=GardenI18n.text('exported',lang)}catch(_){document.querySelector('[role=status]').textContent=GardenI18n.text('invalid',lang)}}})()
</script></html>
